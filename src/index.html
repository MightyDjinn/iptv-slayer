<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IPTV Slayer</title><style>body{font-family:system-ui;max-width:850px;margin:2rem auto;padding:0 1rem;background:#151b25;color:#eee}input,button{font:inherit;padding:.5rem}input{width:90%}video{width:100%;background:#000;max-height:55vh}li{margin:.4rem 0}button{cursor:pointer}</style></head><body>
<h1>IPTV Slayer</h1><p>Choose a channel to play in your browser. Playback depends on browser format and provider CORS support.</p><video controls playsinline></video><p id="status" role="status"></p><label for="search">Search channels</label><p><input id="search" type="search" placeholder="Search"></p><ul id="channels"></ul>
<script>
const list=document.querySelector('#channels'), search=document.querySelector('#search'), video=document.querySelector('video'), status=document.querySelector('#status');
let channels=[], playbackAttempt=0;
function render(){list.replaceChildren();channels.forEach((c,i)=>{if(!c.name.toLowerCase().includes(search.value.toLowerCase()))return;const li=document.createElement('li'), button=document.createElement('button');button.textContent=`${i+1}. ${c.name}`;button.addEventListener('click',()=>{const attempt=++playbackAttempt;video.src=c.url;status.textContent=`Playing: ${c.name}`;video.play().catch(()=>{if(attempt===playbackAttempt)status.textContent='Playback failed. The stream format or provider may not be supported by this browser.'})});li.append(button);list.append(li)})}
search.addEventListener('input',render);video.addEventListener('error',()=>{status.textContent='Playback failed. The stream format or provider may not be supported by this browser.'});fetch('/api/channels').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{channels=data;render()}).catch(()=>status.textContent='Could not load channels.');
</script></body></html>
