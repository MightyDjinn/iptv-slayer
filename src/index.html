<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IPTV Slayer</title><style>body{font-family:system-ui;max-width:850px;margin:2rem auto;padding:0 1rem;background:#151b25;color:#eee}input,button{font:inherit;padding:.5rem}input{box-sizing:border-box;width:100%}video{width:100%;background:#000;max-height:55vh}li{margin:.4rem 0}button{cursor:pointer}fieldset{margin:1rem 0}label{display:block;margin:.6rem 0 .2rem}small{color:#ccc}</style></head><body>
<h1>IPTV Slayer</h1>
<form id="source-form"><fieldset><legend>Playlist source</legend><label for="source-file">Local M3U file</label><input id="source-file" type="file" accept=".m3u,.m3u8,audio/x-mpegurl,application/vnd.apple.mpegurl"><small>Or enter a web URL below. Clear the file selection to use a URL.</small><label for="source-url">Playlist URL</label><input id="source-url" type="url" placeholder="https://example.com/playlist.m3u"><label for="source-user">HTTP Basic username (optional)</label><input id="source-user" autocomplete="username"><label for="source-password">HTTP Basic password (optional)</label><input id="source-password" type="password" autocomplete="current-password"><p><button type="submit">Load playlist</button></p><p id="source-status" role="status"></p></fieldset></form>
<p>Choose a channel to play in your browser. Playback depends on browser format and provider CORS support.</p><video controls playsinline></video><p id="status" role="status"></p><label for="search">Search channels</label><p><input id="search" type="search" placeholder="Search"></p><ul id="channels"></ul>
<script>
const list=document.querySelector('#channels'), search=document.querySelector('#search'), video=document.querySelector('video'), status=document.querySelector('#status');
const sourceForm=document.querySelector('#source-form'), sourceUrl=document.querySelector('#source-url'), sourceUser=document.querySelector('#source-user'), sourcePassword=document.querySelector('#source-password'), sourceFile=document.querySelector('#source-file'), sourceStatus=document.querySelector('#source-status');
let channels=[], revision=0, playbackAttempt=0, sourceLoading=false;
function render(){list.replaceChildren();channels.forEach((c,i)=>{if(!c.name.toLowerCase().includes(search.value.toLowerCase()))return;const li=document.createElement('li'), button=document.createElement('button');button.textContent=`${i+1}. ${c.name}`;button.addEventListener('click',()=>{const attempt=++playbackAttempt;video.src=c.url;status.textContent=`Playing: ${c.name}`;video.play().catch(()=>{if(attempt===playbackAttempt)status.textContent='Playback failed. The stream format or provider may not be supported by this browser.'})});li.append(button);list.append(li)})}
sourceForm.addEventListener('submit',async event=>{event.preventDefault();if(sourceLoading)return;const file=sourceFile.files[0];if(!file&&!sourceUrl.value.trim()){sourceStatus.textContent='Choose a local file or enter a playlist URL.';return}if(file&&file.size>10*1024*1024){sourceStatus.textContent='Playlist exceeds 10 MiB.';return}sourceLoading=true;sourceStatus.textContent='Loading playlist…';const current=++revision;try{const payload=file?{content:await file.text()}:{url:sourceUrl.value.trim(),...(sourceUser.value||sourcePassword.value?{username:sourceUser.value,password:sourcePassword.value}:{})};const response=await fetch('/api/playlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok)throw Error('Could not load playlist. Check the source and credentials.');const data=await response.json();if(current!==revision)return;channels=data;render();sourcePassword.value='';sourceStatus.textContent=`Loaded ${channels.length} channels.`}catch(error){if(current===revision)sourceStatus.textContent='Could not load playlist. Check the source and credentials.'}finally{sourceLoading=false}});
search.addEventListener('input',render);video.addEventListener('error',()=>{status.textContent='Playback failed. The stream format or provider may not be supported by this browser.'});const initialRevision=revision;fetch('/api/channels').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{if(initialRevision===revision){channels=data;render();if(!channels.length)sourceStatus.textContent='Choose a playlist file or enter a playlist URL to get started.'}}).catch(()=>status.textContent='Could not load channels.');
</script></body></html>
